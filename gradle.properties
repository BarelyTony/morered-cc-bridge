# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[26.1,26.2)
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.94

## Dependency Properties

# Ex Machina - Commoble's graph framework. As of MC 1.22/26.x, More Red delegates ALL wire/cable
# connectivity to Ex Machina's Signal Graph, so this - not More Red itself - is the integration surface.
# Published at https://maven.commoble.net
#
# Pinned to 26.1.0.0 on purpose: More Red 26.1.0.5 ships Ex Machina 26.1.0.0 inside itself via
# jar-in-jar, so that is the version actually on the classpath at runtime. Building against the
# newer 26.1.0.2 would risk a NoSuchMethodError against the older jar that really loads.
# Compiling against the oldest supported API also keeps us working if More Red bundles a newer one.
exmachina_version=26.1.0.0

# CC: Tweaked API. Published at https://maven.squiddev.cc
# NOTE: CC:T names its NeoForge artifact "-forge-api" (Forge proper was dropped after 1.20.1).
cct_version=1.120.0

# More Red is NOT published to any Maven above 21.10.0, so we do not compile against it.
# This is recorded for documentation / runtime dependency range purposes only.
morered_version=26.1.0.5

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
mod_id=redcc_bridge
# The human-readable display name for the mod.
mod_name=More Red x CC: Tweaked Bridge
# The license of the mod. Review your options at https://choosealicense.com/.
mod_license=MIT
# The mod version. See https://semver.org/
# Semver only - the Minecraft version belongs in the jar filename (see archivesName in
# build.gradle), not here, or dependency ranges have to reason about a string starting with 26.
mod_version=1.0.0
# The group ID for the mod. This should match the base package used for the mod sources.
mod_group_id=dev.barelytony.redccbridge
